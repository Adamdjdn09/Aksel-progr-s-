function setupCar(){
  var c=$('car');if(!c)return;
  var d=c.parentNode.querySelectorAll('#dots i');
  c.scrollLeft=S.slide*c.clientWidth;
  c.addEventListener('scroll',function(){
    var i=Math.round(c.scrollLeft/(c.clientWidth||1));
    if(i!==S.slide){S.slide=i;for(var k=0;k<d.length;k++)d[k].className=k===i?'on':''}
  },{passive:true});
  var sx=0,sl=0,on=false;
  c.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;on=true;sx=e.clientX;sl=c.scrollLeft;c.classList.add('drag')});
  c.addEventListener('pointermove',function(e){if(on)c.scrollLeft=sl-(e.clientX-sx)});
  function end(){if(!on)return;on=false;c.classList.remove('drag');c.scrollTo({left:Math.round(c.scrollLeft/c.clientWidth)*c.clientWidth,behavior:'smooth'})}
  c.addEventListener('pointerup',end);c.addEventListener('pointerleave',end);
}
function home(){
  var x=t(),h='<div class="top"><h1>'+x.title+'</h1><button class="ic" onclick="cycleTheme()" aria-label="theme">'+(isDark()?'☀︎':'☾')+'</button></div>';
  h+='<div class="car" id="car"><div class="slide"><img class="adimg" alt="Student Campus" draggable="false" src="'+BANNER+'"></div><div class="slide"><div class="banner"><div class="bt"><b>'+x.uni+'</b><small>'+x.id+'</small></div><div class="logo"><img alt="" draggable="false" src="'+LOGO+'"></div></div></div></div>';
  h+='<div class="dots" id="dots" aria-hidden="true"><i class="'+(S.slide?'':'on')+'"></i><i class="'+(S.slide?'on':'')+'"></i></div><div class="grid">';
  x.tiles.forEach(function(n,i){h+='<button class="tile" onclick="openSec('+i+')"><span>'+ICONS[i]+'</span>'+n+'</button>'});
  return h+'</div>';
}
function section(){
  var x=t();
  return '<button class="back" onclick="S.sec=null;render()">'+(S.lang==='ar'?'→ ':'← ')+x.back+'</button><h1>'+x.tiles[S.sec]+'</h1><div class="empty"><span>'+ICONS[S.sec]+'</span>'+x.soon+'</div>';
